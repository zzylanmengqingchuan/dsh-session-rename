# dsh-session-rename bundle patch — inserts its row into the web plugin roster.
# The row has two identities:
#   1) host side — the Loader loads lib/index.js (a no-op seat; renaming rides
#      the built-in session.rename wire contract, so no host code is needed);
#   2) browser side — client-modules scans this row, sees the package's
#      dsh.client declaration, and writes lib/client.js into the boot graph.
# Install with:  dsh plugin --profile web add <path-or-npm-name>
- insert:
    - id: ui-session-rename
      name: dsh-session-rename
